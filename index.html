<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medo Samy | Feedback Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #F8FAFC;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- The iframe source will be set dynamically via JS -->
    <iframe id="appFrame" src=""></iframe>

    <script>
        // 1. Google Apps Script Web App Production URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwH29_hisXNswiiJfyTKxIubqdFV5qxaw-ayYkFlzTxsrtiY8WWdwKrx4q2B8uMwKzd2g/exec";

        // 2. Forward ALL current URL parameters (?code=..., &teacher=...) directly to the iframe
        const searchParams = window.location.search;
        const finalUrl = searchParams ? (WEB_APP_URL + searchParams) : WEB_APP_URL;

        // 3. Load the iframe
        document.getElementById('appFrame').src = finalUrl;
    </script>

</body>
</html>
