<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medo Samy | Feedback Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #F8FAFC;
        }
        iframe {
            width: 100%;
            height: calc(100% + 30px);
            border: none;
            /* Negative margin to hide the top Apps Script banner */
            margin-top: -30px; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- The iframe source will be set dynamically via JS -->
    <iframe id="appFrame" src=""></iframe>

    <script>
        // 1. Put your published Google Apps Script Web App URL here
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwH29_hisXNswiiJfyTKxIubqdFV5qxaw-ayYkFlzTxsrtiY8WWdwKrx4q2B8uMwKzd2g/exec";

        // 2. Read the "?code=" parameter from the current URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentCode = urlParams.get('code');

        // 3. Build the final URL
        let finalUrl = WEB_APP_URL;
        if (studentCode) {
            finalUrl += "?code=" + encodeURIComponent(studentCode);
        }

        // 4. Load the iframe
        document.getElementById('appFrame').src = finalUrl;
    </script>

</body>
</html>
